name: Commits

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  subjects:
    name: Check commit subjects
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The whole history, because the check reads the commits between the base
      # and the head rather than a snapshot of the tree.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check each subject against the convention
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./.github/scripts/check-commit-subjects.sh "$BASE" "$HEAD"
